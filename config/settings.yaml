# MT5 AI Analyst Bot — Configuration

claude:
  model: "claude-sonnet-4-6"
  max_tokens: 1024
  temperature: 0.2                  # low = more deterministic analysis
  confidence_threshold: 70          # skip signals below this %
  cache_system_prompt: true

deepseek:
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-pro"

ollama:
  base_url: "http://localhost:11434/v1"
  model: "gpt-oss:120b-cloud"    # model pulled in Ollama (free/local/cloud)

server:
  host: "127.0.0.1"
  port: 8000
  zmq_pull_port: 5555               # receives data from MT5
  zmq_pub_port: 5556                # sends signals back to MT5

symbols:
  cent_suffix: "c"          # Exness cent account symbol suffix
  standard_suffix: "m"      # Exness standard account symbol suffix
  watchlist_base:
    - "BTCUSD"        # Bitcoin  (crypto 24/7)
    - "ETHUSD"        # Ethereum (crypto 24/7)
    - "XAUUSD"        # Gold
    - "EURUSD"        # Euro/USD (forex)
    - "GBPUSD"        # GBP/USD  (forex)
    - "USDJPY"        # USD/JPY  (forex)
  default_timeframes:
    - "M5"
    - "H1"
    - "H4"
    - "D1"
  bars_per_timeframe: 100

risk:
  min_confidence: 80                # minimum confidence % required to execute auto trades
  # Lot sizing mode — choose one:
  #   use_fixed_sl_amount: true  → lot size calculated so SL = exact dollar amount
  #   use_fixed_sl_amount: false → lot size calculated as % of equity (account_risk_percent)
  use_fixed_sl_amount: true
  sl_amount_usd: 50.0               # max loss per trade for USD standard accounts ($50)
  sl_amount_usc: 1000.0             # max loss per trade for USC cent accounts (1000 USC ≈ $10)
  account_risk_percent: 1.0         # only used when use_fixed_sl_amount: false
  max_open_trades: 3
  # Per-account-type lot limits — auto-detected from MT5 account currency
  cent:                             # USC cent account (100 USC = 1 USD)
    min_lot_size: 0.10
    max_lot_size: 10.0
  standard:                         # USD standard account
    min_lot_size: 0.01
    max_lot_size: 1.0
  max_daily_loss_percent: 3.0       # pause bot if daily loss hits 3%
  min_sl_atr_multiplier: 0.5
  max_sl_atr_multiplier: 3.0
  max_sl_pips: 200                  # hard SL cap for standard forex pairs (pips)
  tp1_rr_ratio: 1.5                 # TP1 at 1.5R  → 150 pips at max SL
  tp2_rr_ratio: 2.0                 # TP2 at 2.0R  → 200 pips at max SL
  tp3_rr_ratio: 2.5                 # TP3 at 2.5R  → 250 pips at max SL

news_filter:
  enabled: true
  block_minutes_before: 30
  block_minutes_after: 60
  close_open_positions_minutes: 15
  impact_levels:                    # block these impact levels
    - "HIGH"
    - "MEDIUM"
  calendar_refresh_hours: 4
  warning_minutes_before: 30        # warn when event is within N minutes (matches block_minutes_before)
  warning_check_interval_min: 15    # how often the warning job runs

kitco_news:
  enabled: true
  check_interval_min: 5             # how often to poll Kitco website
  model: "deepseek"                 # AI model used for analysis (e.g. deepseek, claude, ollama)
  min_impact_to_alert: "HIGH"       # Only send Telegram alert if AI rates as HIGH, MEDIUM, or LOW


mt5_fetcher:
  enabled: true
  use_agent: true                   # true = full agent mode, false = signal-only analyst
  symbol: "XAUUSD"                   # base symbol — suffix added automatically at runtime
  dxy_symbol: "DXY"                  # US Dollar Index ticker for correlation (set to "" to disable)
  bars_per_tf: 100
  check_interval_sec: 30            # how often to poll for a new M5 bar

scanner:
  enabled: false                    # disabled — mt5_fetcher handles data collection
  interval_minutes: 15
  top_signals_per_cycle: 1

sessions:
  sydney:
    open: "21:00"
    close: "06:00"
  tokyo:
    open: "00:00"
    close: "09:00"
  london:
    open: "07:00"
    close: "16:00"
  new_york:
    open: "12:00"
    close: "21:00"
  timezone: "UTC"

indicators:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  ema_periods:
    - 20
    - 50
    - 200
  sr_lookback_bars: 50              # bars to look back for swing S/R

telegram:
  enabled: true                    # set true after adding token in .env
  send_signal_alerts: true
  send_daily_summary: true
  daily_summary_time: "00:00"       # UTC

trade_manager:
  enabled: true
  check_interval_sec: 10           # how often to check open positions
  breakeven_at_r: 1.0              # move SL to entry when position profits N×R
  trail_tp1_at_r: 2.5              # move SL to TP1 when position profits N×R (past TP2)

strategy:
  active: "ema_pullback"           # ema_pullback | asian_breakout | sr_bounce
  auto_trade: true                 # true = place orders automatically; false = alert only
  scan_all_symbols: false          # true = scan full watchlist per bar, pick best signal
  ema_pullback:
    trend_tf: "H4"                 # timeframe for trend bias (EMA200)
    entry_tf: "H1"                 # timeframe for pullback entry (EMA20)
    rsi_min: 40                    # RSI must be above this for BUY entry
    rsi_max: 60                    # RSI must be below this for SELL entry
    sl_atr_buffer: 1.5             # SL = EMA20 ± (sl_atr_buffer × ATR)
    ema_proximity_atr: 0.5         # price must be within N×ATR of EMA20
    min_confidence: 65             # skip signals below this
  asian_breakout:
    session_start_utc: "00:00"
    session_end_utc: "07:00"
    max_range_atr_mult: 2.0        # ignore if range > N×ATR (widened from 1.5 for more setups)
    breakout_buffer_atr: 0.1       # price must exceed range edge by N×ATR to confirm break
    min_confidence: 65
  sr_bounce:
    proximity_atr: 0.5             # price must be within N×ATR of S/R level
    rsi_oversold: 30               # RSI threshold for bounce buy (tightened from 35)
    rsi_overbought: 70             # RSI threshold for bounce sell (tightened from 65)
    min_strength: 2                # minimum S/R touch count
    min_confidence: 65
  amd_fvg:
    sweep_lookback: 20             # H1 bars to scan back for liquidity sweep
    ref_lookback: 6                # H1 bars before sweep bar that define the accumulation range (session ≈ 5-8 H1 bars)
    sweep_max_age: 12              # reject sweep older than N H1 bars (stale setup)
    min_fvg_atr: 0.15              # FVG must be at least N × H1 ATR (filters tiny gaps)
    min_confidence: 65

logging:
  level: "INFO"
  file: "logs/bot.log"
  rotation: "10 MB"
  retention: "30 days"

database:
  path: "data/signals.db"
